
# ==========================================
# 1. 基础安全与访问控制
# ==========================================
server {
    listen 19203;
    server_name YQ5287476;

    root /usr/share/nginx/html;
    index index.html;

    
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # 隐藏 Nginx 版本号，防止信息泄露
    server_tokens off;

    # 禁用危险的 HTTP 方法，仅保留业务所需方法
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTION|HEAD)$) {
        return 405;
    }

    # 防止点击劫持、MIME类型嗅探等常见 Web 攻击
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 禁止访问隐藏文件（如 .git, .env 等敏感文件）
    location ~ /\. {
        deny all;
        return 404;
    }

    # ==========================================
    # 2. 前端静态资源优化
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;

        # 对静态资源开启浏览器端强缓存，减轻服务器压力
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # ==========================================
    # 3. 后端 API 代理与高可用配置
    # ==========================================
    # 提取公共的代理头配置，减少代码冗余
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 隐藏后端服务可能泄露的敏感响应头
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 通用 API 代理配置
    location /api/ {
        proxy_pass http://backend:8082;

        # 必须在 location 内重新声明，否则 server 级别的头因 Connection 这一行而不会被继承
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【严格保留原连接池与超时信息】
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 企业级高可用：遇到错误、超时或 502/503 时自动重试下一个节点
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # 健康检查接口（通常供 K8s 或负载均衡器使用）
    location /check {
        proxy_pass http://backend:8082;
        proxy_read_timeout 30s;
        access_log off; # 健康检查请求频繁，关闭日志减少磁盘IO
    }

    # 长耗时任务接口
    location /execute {
        proxy_pass http://backend:8082;
        proxy_read_timeout 300s;
    }

    # 动态 HTML 渲染接口
    location /html/ {
        proxy_pass http://backend:8082;
    }
}
